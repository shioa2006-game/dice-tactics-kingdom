<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inkstone Game Kit</title><style>body{font:18px/1.6 system-ui;background:#f3eee3;color:#282e27;max-width:1100px;margin:24px auto;padding:20px}h1{font-size:32px}label{display:inline-block;margin:8px}select,button{font:inherit;min-height:50px;padding:8px;border:2px solid #60705d;border-radius:6px}canvas{width:100%;display:block;background:#eee9dd;border:1px solid #60705d}pre{font-size:16px;white-space:pre-wrap}</style><h1>Inkstone Game Kit</h1><p>選択したキャラクターを、独立したRendererで表示しています。</p><label>キャラクター <select id="character"></select></label><label id="direction-label">向き <select id="direction"><option>NW</option><option>NE</option><option selected>SW</option><option>SE</option></select></label><label>動作 <select id="action"></select></label><label>描画方式 <select id="mode"><option value="live">Live Vector</option><option value="cached">Cached Frames</option></select></label><canvas id="scene" aria-label="選択したキャラクターの部屋"></canvas><p id="status" role="status"></p><details><summary>診断情報</summary><pre id="diagnostics"></pre></details><script type="module" src="./main.js"></script></html>
